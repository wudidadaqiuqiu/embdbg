[focdbg]
# Target / probe
device = "STM32G431CB"
interface = "SWD"
speed_khz = 1000
# run_after_flash = false keeps the core halted after programming, which is what
# you want when you are about to set breakpoints. Set true for headless CI.
run_after_flash = false

# Symbols: absolute path so the tool works from any working directory.
# If you copy this file into the firmware project root, use "build/Debug/foc.elf".
elf = "C:/docs/uni/research/PAT/foc/foc_open/software/Source_Project/build/Debug/foc.elf"

# Toolchain (leave empty for auto-discovery)
# gdb = "C:/ST/STM32CubeCLT_1.22.0/GNU-tools-for-STM32/bin/arm-none-eabi-gdb.exe"
# jlink_server = "C:/Program Files/SEGGER/JLink_V810/JLinkGDBServerCL.exe"

# Behaviour
singlerun = true
verify = true
hw_breakpoints = true
base_port = 2331

# --- plugins ---------------------------------------------------------
# [plugins.serial]
# port = "COM4"          # device or pyserial URL (loop:// for tests)
# baudrate = 115200
# bytesize = 8
# parity = "N"           # N/E/O/M/S
# stopbits = "1"         # 1 / 1.5 / 2
# flow = "none"          # none / rtscts / xonxoff / dsrdtr
# timeout = 0.1
# mode = "monitor"       # idle / monitor (serve starts the reader)
# log = "serial.log"     # monitor output file (default stderr)
# hex = false
# timestamp = true
